server:
  port: 3500

spring:
  application:
    name: riu-searcher
  jpa:
    hibernate:
      ddl-auto: update
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:oracle:thin:@oracle:1521/FREEPDB1
    username: riu_user
    password: RiuUserPassword123
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 10000
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer